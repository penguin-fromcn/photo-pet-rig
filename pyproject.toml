[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-pet-rig"
version = "0.1.0"
description = "Turn a full-body photo into a pivot-rigged 2D desktop pet with an AI-agent prompt and a deterministic Python builder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "photo-pet-rig contributors" }]
keywords = ["desktop-pet", "2d", "rig", "cutout", "photo", "animation", "ai-agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# Windows desktop runtime (rendering, physics, tray, interaction).
pet = ["PySide6>=6.6,<7"]
rembg = ["rembg[cpu]>=2.0.50"]
dev = ["pytest>=8", "PySide6>=6.6,<7"]

[project.scripts]
photopet = "photopet.cli:main"

[tool.setuptools.packages.find]
include = ["photopet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
